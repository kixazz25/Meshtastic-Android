<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #map { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map, tileLayer, markers = {}, deviceMarker = null;
    function setTileUrl(url) {
      if (tileLayer) map.removeLayer(tileLayer);
      tileLayer = L.tileLayer(url, {maxZoom:19});
      tileLayer.addTo(map);
    }
    function setView(lat, lon, zoom) { map.setView([lat, lon], zoom); }
    function fitBounds(lats, lons) {
      if (!lats.length) return;
      if (lats.length === 1) { map.setView([lats[0], lons[0]], 16); return; }
      var b = L.latLngBounds();
      for (var i=0; i<lats.length; i++) b.extend([lats[i], lons[i]]);
      map.fitBounds(b, {padding:[60,60]});
    }
    function clearMarkers() {
      for (var id in markers) map.removeLayer(markers[id]);
      markers = {};
    }
    function addMarker(id, lat, lon, color, label, isMine) {
      if (markers[id]) map.removeLayer(markers[id]);
      var sz = isMine ? 20 : 14;
      var shape = isMine ? "50%" : "3px";
      var icon = L.divIcon({className:"",
        html:"<div style='width:"+sz+"px;height:"+sz+"px;background:"+color+";border:2px solid white;border-radius:"+shape+";box-shadow:0 0 4px rgba(0,0,0,0.5)'></div>",
        iconSize:[sz,sz], iconAnchor:[sz/2,sz/2]});
      var m = L.marker([lat,lon],{icon:icon}).addTo(map);
      m.bindTooltip(label,{permanent:true,direction:"top",offset:[0,-sz]});
      markers[id] = m;
    }
    function initDeviceLocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(function(pos) {
        var lat = pos.coords.latitude, lon = pos.coords.longitude;
        if (deviceMarker) map.removeLayer(deviceMarker);
        var icon = L.divIcon({className:"",
          html:"<div style='width:16px;height:16px;background:#2196F3;border:3px solid white;border-radius:50%;box-shadow:0 0 8px rgba(33,150,243,0.8)'></div>",
          iconSize:[16,16],iconAnchor:[8,8]});
        deviceMarker = L.marker([lat,lon],{icon:icon}).addTo(map);
        deviceMarker.bindTooltip("ME",{permanent:true,direction:"top"});
        map.setView([lat,lon],16);
      }, function(err) {
      }, {enableHighAccuracy:true,timeout:10000});
    }
    var trackLines = [];
    function drawTrack(segments) {
      trackLines.forEach(function(l){ map.removeLayer(l); });
      trackLines = [];
      segments.forEach(function(seg) {
        var line = L.polyline(
          [[seg.startLat, seg.startLon], [seg.endLat, seg.endLon]],
          {color: seg.color, weight: 4, opacity: 0.85}
        ).addTo(map);
        trackLines.push(line);
      });
    }
    document.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() {
        map = L.map("map",{zoomControl:true}).setView([36.1069,-115.1711],4);
        map.invalidateSize();
        initDeviceLocation();
      }, 500);
    });
  </script>
</body>
</html>
