<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #map { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: blue; }
    #status { position: fixed; top: 10px; left: 10px; z-index: 9999;
      background: rgba(0,0,0,0.7); color: #1CF0A0;
      font-family: monospace; font-size: 14px; padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="status">Loading...</div>
  <div id="map"></div>
  <script>
    var map;
    function initMap() {
      var h = document.getElementById("map").offsetHeight;
      var w = document.getElementById("map").offsetWidth;
      document.getElementById("status").innerText = "div " + w + "x" + h;
      map = L.map("map", { zoomControl: true }).setView([36.1069, -115.1711], 13);
      var tileLayer = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 });
      tileLayer.on("tileload", function() { document.getElementById("status").innerText = "TILES OK"; });
      tileLayer.on("tileerror", function() { document.getElementById("status").innerText = "TILE ERROR"; });
      tileLayer.addTo(map);
      map.invalidateSize();
    }
    document.addEventListener("DOMContentLoaded", function() {
      setTimeout(initMap, 500);
    });
  </script>
</body>
</html>
