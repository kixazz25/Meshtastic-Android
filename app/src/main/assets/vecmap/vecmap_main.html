<!doctype html>
<!-- VECSWITCH-2026-10-30 (2.7e step 4.2): THE ONE MAP PAGE FOR THE VECTOR ENGINE. Loaded instead of convoy_map.html when Map Sources is set
     to Vector. The app calls this page by the SAME function names it calls on convoy_map.html; each is ported in step 4.3 -- until then
     each is a stub that logs "VECPORT todo <name>" once. A name the app calls that is not here shows as a ReferenceError in ConvoyJS:
     that list is the port list. Served by the app at https://gtvec.local/a/ (VecMapServer); tiles from the VEC store; nothing online. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="maplibre-gl.css"><script src="maplibre-gl.js"></script>
<style>html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden}
#map{position:fixed;top:0;right:0;bottom:0;left:0}  /* VECMAINFIXED-2026-10-30: as convoy_map.html:13 (absolute measured 0 high) */</style>
</head><body><div id="map"></div>
<script>
window.__htmlVersion = 'VECMAIN-2026-10-30';
// VECMARKER3D-2026-10-31 (Fred 09:00): in 3D MapLibre tests every marker ~10x a second for terrain cover with a GPU depth read-back
// (Marker._updateOpacity -> terrain.depthAtPoint) and fades covered ones to 20 % -- hundreds of GPU stalls a second with many pins.
// Markers skip it: always fully visible, no read-backs. (No terrain in 2D, so nothing changes there.)
try {
  maplibregl.Marker.prototype._updateOpacity = function () { if (this._element && this._element.style.opacity !== '1') this._element.style.opacity = '1'; };
  console.log('VECMARKER3D marker terrain test off');
} catch (e) { console.log('VECMARKER3D failed ' + e); }
// tiles through the page (VECMAPPROTO-2026-10-30): gt://t/z/x/y.pbf -> https://gtvec.local/t/z/x/y.pbf
maplibregl.addProtocol('gt', function (params, abortController) {
  var u = params.url.replace('gt://', 'https://gtvec.local/');
  var gtH = window.gtReqStart ? gtReqStart(params.url) : null;   // VECWATCH-2026-10-31
  return fetch(u, { signal: abortController.signal }).then(function (r) {
    if (!r.ok) { if (window.gtReqEnd) gtReqEnd(gtH, false); throw new Error('tile HTTP ' + r.status + ' ' + u); }
    var held = r.headers.get('X-GT-Held');   // VECNODATA-2026-10-31
    return r.arrayBuffer().then(function (b) { if (window.gtTileSeen) gtTileSeen(params.url, held); if (window.gtReqEnd) gtReqEnd(gtH, true); return b; });
  }).then(function (b) { return { data: b }; });
});
var map = new maplibregl.Map({ container: 'map', style: 'liberty_style.json', center: [-98.5, 39.5], zoom: 4,
  maxZoom: 20, maxPitch: 70, attributionControl: { compact: true } });
// VECCOMPASS-2026-10-30 (Fred 17:39): no MapLibre control -- the app has + / - under MENU and the compass beside it
map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }), 'bottom-left');
// VECELEV-2026-10-31 (Fred 14:51): in 3D every animated move unfreezes the ground height when it ends (freezeElevation: true) --
// without it MapLibre kept the ground at sea level after our tilt / turns / zoom-backs and the raised terrain filled the view.
['easeTo', 'flyTo'].forEach(function (fn) {
  var orig = map[fn].bind(map);
  map[fn] = function (opts, ev) {
    if (map.terrain && opts && opts.freezeElevation === undefined) opts = Object.assign({}, opts, { freezeElevation: true });
    return orig(opts, ev);
  };
});
console.log('VECELEV 3D moves unfreeze the ground height');
map.on('load', function () { console.log('VECMAIN loaded ' + map.getContainer().clientWidth + 'x' + map.getContainer().clientHeight); });
map.on('error', function (e) { console.log('VECMAIN error ' + (e && e.error ? e.error.message : e)); });
window.addEventListener('resize', function () { map.resize(); });
setTimeout(function () { map.resize(); }, 500);
// VECMAINSIZE-2026-10-30: the ONE MAP web view is laid out after the page starts (13:44: loaded 0x0) -- watch the size, re-measure
var gtLastSize = '';
setInterval(function () {
  var c = map.getContainer(), s = c.clientWidth + 'x' + c.clientHeight + ' window ' + window.innerWidth + 'x' + window.innerHeight;
  // VECMAINFIXED-2026-10-30: never a zero-high map while the window has height
  if (c.clientHeight === 0 && window.innerHeight > 0) {
    c.style.width = window.innerWidth + 'px'; c.style.height = window.innerHeight + 'px';
    console.log('VECMAINFIXED forced ' + window.innerWidth + 'x' + window.innerHeight);
    s = c.clientWidth + 'x' + c.clientHeight + ' window ' + window.innerWidth + 'x' + window.innerHeight;
  }
  if (s !== gtLastSize) { gtLastSize = s; map.resize(); console.log('VECMAIN size ' + s); }
}, 1000);

// ---- PORTED (4.2) ----------------------------------------------------------------------------------------------------
function setView(lat, lon, z) { map.resize(); /* VECMAINSIZE-2026-10-30 */ map.jumpTo({ center: [lon, lat], zoom: (z == null ? map.getZoom() : z) }); }

// ---- NOT YET PORTED: stubs, logged once each (4.3 replaces them one by one) ------------------------------------------
var gtTodoSeen = {};
function gtTodo(name) {
  return function () {
    if (!gtTodoSeen[name]) { gtTodoSeen[name] = 1; console.log('VECPORT todo ' + name + ' (' + arguments.length + ' args)'); }
    return null;
  };
}
['fitBounds', 'setTileUrl', 'activateDrawMode', 'triggerViewportUpdate', 'setOverlayLayers', 'removeMarker', 'drawBuildLine',
 'addMarker', 'showDownloadedAreas', 'setTrailStyles', 'setRouteMode', 'setLastHeard', 'longPressAt', 'fitBatchRoutes',
 'findNearestMarker', 'drawTrack', 'clearMarkers',
 'renderPins', 'clearAreaBoundary', 'showAimRing',   /* VECPORT1-2026-10-30: called by the app, missing (13:44 ReferenceErrors) */
 'gtSet3D', 'gtSetHeadingUp'   /* VIEWHOUSE-2026-10-30: the 3D and orientation buttons -- placeholders */
].forEach(function (n) { window[n] = gtTodo(n); });
</script>
<!-- VECPORT1-2026-10-30: the filter overlays, viewport, taps, long-press, setView / fitBounds / setRouteMode -- after the stubs, so they replace them -->
<script src="vec_spatial.js"></script>
<!-- VEC3D-2026-10-30: 3D terrain + hillshading from the DEM store, behind the 3D button -->
<script src="vec_view.js"></script>
<!-- VECHEADING-2026-10-30: the carts + N up / My dir -->
<script src="vec_carts.js"></script>
<!-- VECCOMPASS-2026-10-30: the bearing for the compass beside MENU -->
<script src="vec_compass.js"></script>
<!-- VECARTSTYLE-2026-10-30: MAP KEY "My tracks" / "My routes" style the map -->
<script src="vec_artstyle.js"></script>
<!-- VECTRACKS-2026-10-30: my track + the lead track -->
<script src="vec_tracks.js"></script>
<!-- VECLAND-2026-10-31: ground-type fills (rock, scrub, farmland; trees and grass stronger) -->
<script src="vec_land.js"></script>
<!-- VECNODATA-2026-10-31: past the downloaded maps -> back + note -->
<script src="vec_nodata.js"></script>
<!-- VECWATCH-2026-10-31: the heartbeat -->
<script src="vec_watch.js"></script></body></html>
