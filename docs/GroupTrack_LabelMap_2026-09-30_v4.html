<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GroupTrack label map 2026-09-30 v4</title>
<style>
:root{
  --bg:#0f1216; --panel:#161b22; --line:#2b323b; --text:#e6edf3; --muted:#8b949e;
  --keep:#58a6ff; --changed:#e3b341; --new:#ff3dff; --removed:#6e7681; --check:#3fb950;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;font-weight:600;margin:0 12px 0 0}
.tabs{display:flex;gap:4px}
.tab{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer;font:inherit}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--keep);background:#1b2430}
.actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
button.act,label.act{background:#21262d;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
button.act:hover,label.act:hover{border-color:var(--keep)}
:focus-visible{outline:2px solid var(--keep);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;padding:14px 18px;align-items:start}
.left{position:sticky;top:14px}
aside{max-height:calc(100vh - 90px);overflow-y:auto;padding-right:6px;position:sticky;top:14px}
@media (max-width:1000px){main{grid-template-columns:1fr}.left{position:static}aside{max-height:none;position:static}}
.stage{position:relative;align-self:start;user-select:none;touch-action:none;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000}
.stage img{display:block;width:100%;height:auto;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#000;
  border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.55);cursor:grab;touch-action:none}
.pin.dragging{cursor:grabbing;opacity:.85}
.note{color:var(--muted);font-size:13px;margin:8px 2px 0}
aside{min-width:0}
aside h2{font-size:15px;font-weight:600;margin:0 0 4px}
aside p.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.row{display:grid;grid-template-columns:34px 44px 1fr;gap:4px 8px;align-items:center;padding:5px 6px;border-top:1px solid var(--line)}
.row .chip{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;border:2px solid #fff;cursor:grab;touch-action:none}
.row .chip.placed{box-shadow:0 0 0 3px var(--bg),0 0 0 5px currentColor}
.row input,.row select{background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font:inherit;font-size:14px;min-width:0}
.row input.letter{width:44px;text-align:center;font-weight:700}
.row .meta{grid-column:2 / 4;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .meta input.sec{width:70px}
.row .meta .desc{color:var(--muted);font-size:12.5px;flex-basis:100%}
.row .meta button{background:none;border:none;color:var(--muted);cursor:pointer;font:inherit;font-size:12.5px;padding:0;text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin:0 0 8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}
.count{font-size:13px;color:var(--muted);margin:10px 2px}
.ghost{position:fixed;pointer-events:none;z-index:10;transform:translate(-50%,-50%)}
</style>
</head>

const COLORS = {keep:'#58a6ff', changed:'#e3b341', new:'#ff3dff', removed:'#6e7681', check:'#3fb950'};
let tab = 'plan';
const $ = id => document.getElementById(id);

function nextLetter(items){
  const used = items.map(i => i.letter.toUpperCase());
  for (let c = 65; c <= 90; c++){ const L = String.fromCharCode(c); if (!used.includes(L)) return L; }
  return '?';
}
function colorOf(it){ return COLORS[it.status] || COLORS.keep; }

function render(){
  const m = DATA[tab];
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('pic').src = m.image; $('pic').alt = m.title;
  $('picnote').textContent = m.note;
  $('listtitle').textContent = m.title + ' — ' + m.items.length + ' launch points';
  // pins
  document.querySelectorAll('.pin').forEach(p => p.remove());
  m.items.forEach((it, i) => {
    if (it.x == null) return;
    const p = document.createElement('div');
    p.className = 'pin'; p.textContent = it.letter; p.style.background = colorOf(it);
    p.style.left = (it.x * 100) + '%'; p.style.top = (it.y * 100) + '%';
    p.title = it.letter + ' · ' + it.title;
    p.addEventListener('pointerdown', e => startDrag(e, i, true));
    $('stage').appendChild(p);
  });
  // list
  const list = $('list'); list.innerHTML = '';
  m.items.forEach((it, i) => {
    const row = document.createElement('div'); row.className = 'row';
    const chip = document.createElement('div');
    chip.className = 'chip' + (it.x != null ? ' placed' : ''); chip.textContent = it.letter;
    chip.style.background = colorOf(it); chip.style.color = '#000';
    chip.style.setProperty('color', '#000'); chip.title = 'Drag onto the picture';
    chip.addEventListener('pointerdown', e => startDrag(e, i, false));
    const L = document.createElement('input'); L.className = 'letter'; L.value = it.letter; L.maxLength = 2;
    L.setAttribute('aria-label', 'Letter for ' + it.title);
    L.addEventListener('change', () => { it.letter = L.value.trim().toUpperCase() || '?'; render(); });
    const T = document.createElement('input'); T.value = it.title; T.setAttribute('aria-label', 'Title');
    T.addEventListener('change', () => { it.title = T.value; render(); });
    const meta = document.createElement('div'); meta.className = 'meta';
    const S = document.createElement('input'); S.className = 'sec'; S.value = it.section; S.placeholder = 'section';
    S.setAttribute('aria-label', 'Manual section');
    S.addEventListener('change', () => { it.section = S.value.trim(); });
    const st = document.createElement('select'); st.setAttribute('aria-label', 'Status');
    ['keep','changed','new','removed','check'].forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; if (v === it.status) o.selected = true; st.appendChild(o); });
    st.addEventListener('change', () => { it.status = st.value; render(); });
    meta.append(S, st);
    if (it.x != null){ const b = document.createElement('button'); b.textContent = 'take off picture';
      b.addEventListener('click', () => { it.x = it.y = null; render(); }); meta.append(b); }
    const del = document.createElement('button'); del.textContent = 'delete';
    del.addEventListener('click', () => { if (confirm('Delete ' + it.letter + ' · ' + it.title + '?')) { m.items.splice(i, 1); render(); } });
    meta.append(del);
    if (it.note){ const d = document.createElement('div'); d.className = 'desc'; d.textContent = it.note; meta.append(d); }
    row.append(chip, L, T, meta);
    list.appendChild(row);
  });
  const placed = m.items.filter(i => i.x != null).length;
  $('count').textContent = placed + ' of ' + m.items.length + ' placed on the picture.';
}

let drag = null;
function startDrag(e, index, fromPin){
  e.preventDefault();
  const it = DATA[tab].items[index];
  const g = document.createElement('div');
  g.className = 'pin ghost dragging'; g.textContent = it.letter; g.style.background = colorOf(it);
  g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px';
  document.body.appendChild(g);
  drag = {index, fromPin, ghost: g};
  window.addEventListener('pointermove', moveDrag);
  window.addEventListener('pointerup', endDrag, {once: true});
}
function moveDrag(e){ if (!drag) return; drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px'; }
function endDrag(e){
  window.removeEventListener('pointermove', moveDrag);
  if (!drag) return;
  const r = $('pic').getBoundingClientRect();
  const it = DATA[tab].items[drag.index];
  const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  if (inside){ it.x = +((e.clientX - r.left) / r.width).toFixed(4); it.y = +((e.clientY - r.top) / r.height).toFixed(4); }
  else if (drag.fromPin){ it.x = it.y = null; }
  drag.ghost.remove(); drag = null; render();
}

function download(name, blob){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
$('expjson').addEventListener('click', () => {
  const out = {generated: new Date().toISOString(), tool: 'GroupTrack_LabelMap_2026-09-30_v4', maps: {}};
  for (const k in DATA) out.maps[k] = {title: DATA[k].title, chapter: DATA[k].chapter, picture: DATA[k].pictureName || 'manual v24 overview',
    items: DATA[k].items.map(({letter, title, section, status, note, x, y}) => ({letter, title, section, status, note, x, y}))};
  download('labelmap_2026-09-30.json', new Blob([JSON.stringify(out, null, 2)], {type: 'application/json'}));
});
$('imp').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    try {
      const j = JSON.parse(t);
      for (const k in (j.maps || {})) if (DATA[k]) DATA[k].items = j.maps[k].items.map(i => Object.assign({note: ''}, i));
      render();
    } catch (err) { alert('That file is not a label map export: ' + err.message); }
  });
  e.target.value = '';
});
$('shot').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { DATA[tab].image = rd.result; DATA[tab].pictureName = f.name;
    DATA[tab].note = 'Current screenshot loaded: ' + f.name + '. Positions are kept as fractions of the picture, so letters stay put if the size changes.'; render(); };
  rd.readAsDataURL(f); e.target.value = '';
});
$('add').addEventListener('click', () => {
  const m = DATA[tab];
  m.items.push({letter: nextLetter(m.items), title: 'New launch point', section: '', status: 'new', note: '', x: null, y: null});
  render();
});
$('exppng').addEventListener('click', () => {
  const m = DATA[tab], img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    const rad = Math.max(11, Math.round(c.width * 0.019));
    m.items.forEach(it => {
      if (it.x == null) return;
      const x = it.x * c.width, y = it.y * c.height;
      g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fillStyle = colorOf(it); g.fill();
      g.lineWidth = 2; g.strokeStyle = '#fff'; g.stroke();
      g.fillStyle = '#000'; g.font = 'bold ' + Math.round(rad * 1.1) + 'px Segoe UI, Arial, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(it.letter, x, y + 1);
    });
    c.toBlob(b => download('labelmap_' + tab + '_2026-09-30.png', b), 'image/png');
  };
  img.src = m.image;
});
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); }));
render();
</script>
</body>
</html>
