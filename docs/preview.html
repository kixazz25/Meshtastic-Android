<!DOCTYPE html>
<!--
  preview.html  |  Convoy Tracker — Interactive Map Preview
  Opens directly in Chrome/Firefox — requires internet for tile load.
  Production will swap Leaflet → MapLibre with offline tiles.

  LAYERS:
    z:  0  Leaflet map (pan/zoom/drag like a real map)
    z:100  HUD overlay (transparent, frosted panel top-left)
    z:200  Nav buttons (GROUP | MY CART | HIDE | GEAR)

  CONVOY: Saint George UT area, nodes spread along SR-18 northbound
    LEAD-1    #1cf0a0  front
    INDIA-9   #00d4cc
    HOTEL-10  #f9c835  ★ operator (you)
    GOLF-8    #4da6ff
    FOXTROT-7 #b06fff
    ECHO-6    #a3e635
    KILO-13   lost/dim
    SIERRA-20 #ff8c42  tail
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Convoy Tracker — Preview</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
:root {
  --m-bg:         #1C1B1F;
  --m-surface:    #2B2930;
  --m-outline:    #49454F;
  --m-primary:    #67EA94;
  --m-on-primary: #003920;
  --m-error:      #FFB4AB;
  --m-warn:       #F9C835;
  --m-text:       #E6E1E5;
  --m-text-dim:   #CAC4D0;
  --m-text-faint: #938F99;
  --btn-h: 68px;
  --font: 'Roboto', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden;
             background: #1C1B1F; font-family: var(--font); }

/* ══ LAYER 1: MAP z:0 ══ */
#map {
  position: fixed;
  inset: 0;
  z-index: 0;
  /* dark tile filter — makes OSM tiles look like a dark map */
  filter: brightness(0.55) invert(1) hue-rotate(180deg) saturate(0.7) brightness(0.85);
}
/* Leaflet UI elements — keep on top of map but below HUD */
.leaflet-control-container { z-index: 50 !important; }

/* ══ LAYER 2: HUD z:100 ══ */
.hud-overlay {
  position: absolute; top: 0; left: 0; right: 0;
  bottom: var(--btn-h);
  z-index: 100;
  background: transparent;
  pointer-events: none;
  transition: opacity 0.22s ease;
}
.hud-overlay.hidden { opacity: 0; pointer-events: none; }

/* LOST banner */
.lost-banner {
  pointer-events: auto; width: 100%;
  background: rgba(255,180,171,0.14);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,180,171,0.28);
  padding: 7px 14px; display: flex; align-items: center; gap: 8px;
}
.lost-icon { font-size: 13px; }
.lost-callsign {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.8px; text-transform: uppercase; color: var(--m-error);
}
.lost-coords { font-size: 9px; color: rgba(255,180,171,0.65); margin-top: 1px; }

/* Frosted stats card */
.hud-panel {
  pointer-events: auto;
  position: absolute; top: 44px; left: 12px; width: 192px;
  background: rgba(28,27,31,0.72);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(73,69,79,0.5);
  border-radius: 12px; overflow: hidden;
}
.panel-hdr {
  padding: 7px 12px 5px;
  border-bottom: 1px solid rgba(73,69,79,0.3);
  display: flex; align-items: center; justify-content: space-between;
}
.panel-title {
  font-size: 10px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase; color: var(--m-primary);
}
.panel-node { font-size: 10px; font-weight: 600; color: var(--m-warn); letter-spacing: 0.3px; }

.telem-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1px; background: rgba(73,69,79,0.2);
}
.tc { background: rgba(28,27,31,0.5); padding: 8px 10px 6px; }
.tc-lbl {
  display: block; font-size: 8px; font-weight: 600;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--m-text-faint); margin-bottom: 2px;
}
.tc-val {
  font-size: 19px; font-weight: 700; line-height: 1;
  color: var(--m-text); font-variant-numeric: tabular-nums;
}
.tc-unit { font-size: 9px; color: var(--m-text-faint); }

.prox {
  padding: 7px 10px 5px; border-top: 1px solid rgba(73,69,79,0.2);
  display: flex; flex-direction: column; gap: 5px;
}
.pr { display: flex; align-items: center; gap: 5px; }
.pr-arrow { font-size: 11px; color: var(--m-text-faint); width: 16px; text-align: center; flex-shrink: 0; }
.cdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.pr-name { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; flex: 1; }
.pr-dist { font-size: 11px; font-weight: 700; color: var(--m-text); font-variant-numeric: tabular-nums; }
.pr-unit { font-size: 9px; color: var(--m-text-faint); margin-left: 1px; }

.sstrip {
  padding: 5px 10px 7px; border-top: 1px solid rgba(73,69,79,0.2);
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
}
.chip { display: flex; align-items: center; gap: 3px;
        font-size: 9px; color: var(--m-text-faint); letter-spacing: 0.3px; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--m-primary); flex-shrink: 0; }

/* ══ LAYER 3: BUTTONS z:200 ══ */
.btn-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: var(--btn-h); z-index: 200;
  background: rgba(28,27,31,0.97);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid var(--m-outline);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 4px;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  padding: 6px 4px 8px; border-radius: 12px;
  cursor: pointer; user-select: none; -webkit-user-select: none;
  transition: background 0.12s;
}
.nav-btn:active { background: rgba(103,234,148,0.09); }
.btn-icon {
  width: 52px; height: 30px; border-radius: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.btn-icon svg { width: 22px; height: 22px; fill: var(--m-text-dim); transition: fill 0.15s; }
.btn-label {
  font-size: 10px; font-weight: 500; letter-spacing: 0.5px;
  text-transform: uppercase; color: var(--m-text-dim);
  transition: color 0.15s; white-space: nowrap;
}
.nav-btn.active .btn-icon     { background: var(--m-primary); }
.nav-btn.active .btn-icon svg { fill: var(--m-on-primary); }
.nav-btn.active .btn-label    { color: var(--m-primary); font-weight: 700; }
.nav-btn.hud-off .btn-icon     { background: rgba(255,180,171,0.15); }
.nav-btn.hud-off .btn-icon svg { fill: var(--m-error); }
.nav-btn.hud-off .btn-label    { color: var(--m-error); }

/* Dev badge */
.dev-badge {
  position: absolute; top: 8px; right: 8px; z-index: 300;
  background: rgba(28,27,31,0.88); border: 1px solid var(--m-outline);
  border-radius: 8px; padding: 5px 9px;
  font-size: 9px; font-family: 'Roboto Mono', monospace;
  color: var(--m-text-faint); letter-spacing: 0.3px; line-height: 1.8;
  pointer-events: none;
}
.dev-badge b { color: var(--m-primary); }

/* Custom node marker pulse for HOTEL-10 */
@keyframes markerPulse {
  0%,100% { box-shadow: 0 0 0 4px rgba(249,200,53,0.2), 0 0 14px rgba(249,200,53,0.4); }
  50%      { box-shadow: 0 0 0 9px rgba(249,200,53,0.05), 0 0 22px rgba(249,200,53,0.15); }
}
.marker-mine { animation: markerPulse 2s ease-in-out infinite; }
</style>
</head>
<body>

<!-- ══ LAYER 1: MAP (Leaflet fills this div) ══ -->
<div id="map"></div>

<!-- ══ LAYER 2: HUD ══ -->
<div class="hud-overlay" id="hudOverlay">
  <div class="lost-banner">
    <span class="lost-icon">⚠</span>
    <div>
      <div class="lost-callsign">Contact Lost · KILO-13</div>
      <div class="lost-coords">Last: 37.4921°N 113.3201°W · 4m 32s ago</div>
    </div>
  </div>
  <div class="hud-panel">
    <div class="panel-hdr">
      <span class="panel-title">My Cart</span>
      <span class="panel-node">★ HOTEL-10</span>
    </div>
    <div class="telem-grid">
      <div class="tc"><span class="tc-lbl">Speed</span><span class="tc-val">18<span class="tc-unit"> mph</span></span></div>
      <div class="tc"><span class="tc-lbl">Heading</span><span class="tc-val">274<span class="tc-unit">°</span></span></div>
      <div class="tc"><span class="tc-lbl">Battery</span><span class="tc-val">84<span class="tc-unit">%</span></span></div>
      <div class="tc"><span class="tc-lbl">Altitude</span><span class="tc-val">2847<span class="tc-unit"> ft</span></span></div>
    </div>
    <div class="prox">
      <div class="pr"><span class="pr-arrow">↑</span><div class="cdot" style="background:#00d4cc"></div><span class="pr-name" style="color:#00d4cc">INDIA-9</span><span class="pr-dist">0.12<span class="pr-unit"> mi</span></span></div>
      <div class="pr"><span class="pr-arrow">↓</span><div class="cdot" style="background:#4da6ff"></div><span class="pr-name" style="color:#4da6ff">GOLF-8</span><span class="pr-dist">0.09<span class="pr-unit"> mi</span></span></div>
      <div class="pr"><span class="pr-arrow">↑↑</span><div class="cdot" style="background:#1cf0a0"></div><span class="pr-name" style="color:#1cf0a0">LEAD-1</span><span class="pr-dist">0.31<span class="pr-unit"> mi</span></span></div>
      <div class="pr"><span class="pr-arrow">↓↓</span><div class="cdot" style="background:#ff8c42"></div><span class="pr-name" style="color:#ff8c42">SIERRA-20</span><span class="pr-dist">0.44<span class="pr-unit"> mi</span></span></div>
    </div>
    <div class="sstrip">
      <div class="chip"><div class="dot"></div>ACTIVE</div>
      <div class="chip"><div class="dot"></div>SNR 7.5</div>
      <div class="chip">PKT 4s</div>
    </div>
  </div>
</div>

<!-- ══ LAYER 3: BUTTONS ══ -->
<div class="btn-bar">
  <div class="nav-btn active" id="btnGroup" onclick="setView('group')">
    <div class="btn-icon"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zM8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></div>
    <span class="btn-label">Group</span>
  </div>
  <div class="nav-btn" id="btnMyCart" onclick="setView('mycart')">
    <div class="btn-icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
    <span class="btn-label">My Cart</span>
  </div>
  <div class="nav-btn" id="btnHide" onclick="toggleHide()">
    <div class="btn-icon"><svg viewBox="0 0 24 24"><path id="eyePath" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg></div>
    <span class="btn-label" id="hideLabel">Hide</span>
  </div>
  <div class="nav-btn" id="btnGear" onclick="flashGear()">
    <div class="btn-icon"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></div>
    <span class="btn-label">Gear</span>
  </div>
</div>

<div class="dev-badge">z:<b>200</b> buttons<br>z:<b>100</b> hud<br>z:<b>000</b> map</div>

<!-- Leaflet JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ─── MAP SETUP ─────────────────────────────────────────
// Convoy positioned along SR-18 north of St George UT
const NODES = [
  { id:'LEAD-1',    color:'#1cf0a0', lat:37.5380, lng:-113.5150 },
  { id:'INDIA-9',   color:'#00d4cc', lat:37.5210, lng:-113.5080 },
  { id:'HOTEL-10',  color:'#f9c835', lat:37.5090, lng:-113.5020, mine:true },
  { id:'GOLF-8',    color:'#4da6ff', lat:37.4980, lng:-113.4970 },
  { id:'FOXTROT-7', color:'#b06fff', lat:37.4860, lng:-113.4910 },
  { id:'ECHO-6',    color:'#a3e635', lat:37.4750, lng:-113.4850 },
  { id:'KILO-13',   color:'#555566', lat:37.4640, lng:-113.4790, lost:true },
  { id:'SIERRA-20', color:'#ff8c42', lat:37.4530, lng:-113.4730 },
];

// Center map on HOTEL-10
const me = NODES.find(n => n.mine);
const map = L.map('map', {
  center: [me.lat, me.lng],
  zoom: 14,
  zoomControl: true,
  attributionControl: false,
}).on('click', () => {}); // prevent any click bubbling issues

// OSM tiles — will swap for MapLibre offline tiles in production
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
}).addTo(map);

// ─── CONVOY TRACK polyline ──────────────────────────────
// Multi-colored segments: each segment = color of rear node of that segment
const trackCoords = NODES.map(n => [n.lat, n.lng]);

// Draw as individual colored segments
for (let i = 0; i < NODES.length - 1; i++) {
  L.polyline(
    [[NODES[i].lat, NODES[i].lng], [NODES[i+1].lat, NODES[i+1].lng]],
    { color: NODES[i+1].color, weight: 5, opacity: 0.85, lineCap: 'round' }
  ).addTo(map);
}

// ─── NODE MARKERS ───────────────────────────────────────
NODES.forEach(node => {
  const size  = node.mine ? 18 : 12;
  const pulse = node.mine ? 'marker-mine' : '';
  const opacity = node.lost ? 0.35 : 1;

  const icon = L.divIcon({
    className: '',
    html: `<div class="${pulse}" style="
      width:${size}px; height:${size}px;
      border-radius:50%;
      background:${node.color};
      border:2px solid rgba(0,0,0,0.6);
      opacity:${opacity};
    "></div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
  });

  const marker = L.marker([node.lat, node.lng], { icon }).addTo(map);
  marker.bindTooltip(node.id, {
    permanent: false,
    direction: 'top',
    className: 'leaflet-tooltip',
    offset: [0, -8],
  });
});

// ─── HUD / BUTTON LOGIC ─────────────────────────────────
const EYE_OPEN = 'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z';
const EYE_OFF  = 'M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75C21.27 7.61 17 4.5 12 4.5c-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z';
let hudHidden = false;

function setView(v) {
  document.getElementById('btnGroup').classList.toggle('active', v==='group');
  document.getElementById('btnMyCart').classList.toggle('active', v==='mycart');
}
function toggleHide() {
  hudHidden = !hudHidden;
  document.getElementById('hudOverlay').classList.toggle('hidden', hudHidden);
  document.getElementById('btnHide').classList.toggle('hud-off', hudHidden);
  document.getElementById('hideLabel').textContent = hudHidden ? 'Show' : 'Hide';
  document.getElementById('eyePath').setAttribute('d', hudHidden ? EYE_OFF : EYE_OPEN);
}
function flashGear() {
  const b = document.getElementById('btnGear');
  b.classList.add('active');
  setTimeout(() => b.classList.remove('active'), 250);
}

// Move HUD and buttons into Leaflet container —
// they become part of the map display, not a separate overlay.
// position:fixed → position:absolute inside map container.
const container = map.getContainer();
container.appendChild(document.querySelector('.hud-overlay'));
container.appendChild(document.querySelector('.btn-bar'));
container.appendChild(document.querySelector('.dev-badge'));

// Leaflet needs a size invalidation after DOM settles
setTimeout(() => map.invalidateSize(), 100);
</script>
</body>
</html>
